[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@^2.5.0
	KGFX=symlink://../../lib/KGFX
	OTAServer=symlink://../../lib/OTAServer
	bblanchon/ArduinoJson@^7.1.0
monitor_speed = 460800
build_flags =
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_MISO=-1
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=2
	-DTFT_RST=4
	-DTFT_BL=15
	-DLOAD_GLCD
	-DLOAD_GFXFF
	-DSMOOTH_FONT
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=27000000
