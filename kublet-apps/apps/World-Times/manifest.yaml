summary: World clock — 5 zones (Asu, Tpa, Ber, Col, UTC)
desc: Five wall clocks at once, one per row in its own color. Asuncion is the reference timezone; today's full date (dd/mm/yyyy) sits in the top header. Zones that land on a different calendar date than Asuncion get a +1d or -1d tag. POSIX TZ strings, so Tampa (EDT) and Berlin (CEST) DST flip automatically. Dot at the bottom is green once NTP has synced.
author: Author_ARK
