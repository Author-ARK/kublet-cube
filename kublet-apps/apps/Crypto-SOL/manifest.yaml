summary: SOL solo — price + 1h chart + 1h delta
desc: Single-coin SOL display. Big Arial_48 price (always 2 decimals), 1h % change next to the ticker (green/red), and a 1h delta-from-baseline filled chart below built from Binance's 1m klines. One klines call per refresh (every full minute, ~6 KB).
